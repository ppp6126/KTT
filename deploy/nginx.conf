# ตัวอย่าง nginx: เสิร์ฟ Angular และส่ง /api ไป Quarkus ในโดเมนเดียวกัน (จำเป็นสำหรับ cookie SameSite=Strict)
server {
    listen 443 ssl http2;
    server_name backoffice.example.co.th;

    ssl_certificate     /etc/ssl/ktt/fullchain.pem;
    ssl_certificate_key /etc/ssl/ktt/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'; frame-ancestors 'none'" always;

    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        client_max_body_size 50m;
    }

    # ไฟล์ที่มี hash ในชื่อ cache ได้นาน
    location ~* \.(js|css|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Angular routing
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}

server {
    listen 80;
    server_name backoffice.example.co.th;
    return 301 https://$host$request_uri;
}
