# =====================================================================
# KTT Back Office - Backend
# ค่าที่ขึ้นต้น %dev / %test / %prod ใช้เฉพาะ profile นั้น
# =====================================================================
quarkus.application.name=ktt-backend
quarkus.http.port=8080
quarkus.http.test-port=8081
quarkus.default-locale=th-TH

# อยู่หลัง reverse proxy (nginx) ให้อ่าน IP จริงจาก X-Forwarded-For
quarkus.http.proxy.proxy-address-forwarding=true
quarkus.http.proxy.allow-x-forwarded=true

# ---------- Database ----------
quarkus.datasource.db-kind=postgresql
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/ktt
%dev.quarkus.datasource.username=ktt
%dev.quarkus.datasource.password=ktt
%prod.quarkus.datasource.jdbc.url=${DB_URL}
%prod.quarkus.datasource.username=${DB_USER}
%prod.quarkus.datasource.password=${DB_PASSWORD}
# %test ไม่ตั้ง URL -> ใช้ Dev Services (ต้องมี Docker)

quarkus.hibernate-orm.jdbc.timezone=UTC
quarkus.hibernate-orm.physical-naming-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
quarkus.hibernate-orm.log.sql=false
%dev.quarkus.hibernate-orm.log.sql=false

quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.fetch.batch-size=32

# ---------- ไฟล์แนบ (เก็บในดิสก์ของเซิร์ฟเวอร์ ต้อง backup พร้อมฐานข้อมูล)
ktt.storage.dir=${KTT_STORAGE_DIR:./data/files}
%prod.ktt.storage.dir=${KTT_STORAGE_DIR:/var/lib/ktt/files}
# ไฟล์สำรองข้อมูล (ZIP) จากหน้า "สำรองข้อมูล" และงานสำรองอัตโนมัติ 02:00
ktt.backup.dir=${KTT_BACKUP_DIR:./data/backups}
%prod.ktt.backup.dir=${KTT_BACKUP_DIR:/var/lib/ktt/backups}
quarkus.http.limits.max-body-size=60M
quarkus.http.limits.max-form-attribute-size=60M

# ---------- JWT ----------
ktt.jwt.issuer=https://ktt.app
mp.jwt.verify.issuer=${ktt.jwt.issuer}
mp.jwt.verify.publickey.algorithm=RS256
# dev/test ใช้คีย์ใน src/main/resources/dev-keys (ห้ามใช้ใน production)
%dev.mp.jwt.verify.publickey.location=dev-keys/publicKey.pem
%dev.smallrye.jwt.sign.key.location=dev-keys/privateKey.pem
%test.mp.jwt.verify.publickey.location=dev-keys/publicKey.pem
%test.smallrye.jwt.sign.key.location=dev-keys/privateKey.pem
%prod.mp.jwt.verify.publickey.location=${JWT_PUBLIC_KEY_LOCATION}
%prod.smallrye.jwt.sign.key.location=${JWT_PRIVATE_KEY_LOCATION}

# ---------- Auth ----------
# endpoint ที่ลืมใส่ @RolesAllowed/@PermitAll/@Authenticated จะถูกปฏิเสธเสมอ (กันหลุดสิทธิ์)
quarkus.security.jaxrs.deny-unannotated-endpoints=true

ktt.auth.access-token-ttl=15M
ktt.auth.refresh-idle-timeout=30M
ktt.auth.refresh-absolute-timeout=12H
ktt.auth.refresh-reuse-grace=20S
%test.ktt.auth.refresh-reuse-grace=0S
ktt.auth.max-failed-logins=5
ktt.auth.lock-duration=15M
ktt.auth.mfa-challenge-ttl=5M
ktt.auth.mfa-max-attempts=5
ktt.auth.password-reset-ttl=30M
ktt.auth.ip-max-attempts=30
ktt.auth.ip-window=5M
ktt.auth.cookie-name=ktt_rt
ktt.auth.cookie-path=/api/auth
ktt.auth.cookie-secure=true
%dev.ktt.auth.cookie-secure=false
%test.ktt.auth.cookie-secure=false

# กุญแจ AES-256 (base64) สำหรับเข้ารหัส TOTP secret: สร้างใหม่ด้วย `openssl rand -base64 32`
%dev.ktt.crypto.data-key=nmeQX7g55KJ2KJByPvoO2UZ5k7YFcYQ8mkCVSx38Kss=
%test.ktt.crypto.data-key=nmeQX7g55KJ2KJByPvoO2UZ5k7YFcYQ8mkCVSx38Kss=
%prod.ktt.crypto.data-key=${KTT_DATA_KEY}

# ผู้ใช้คนแรก (สร้างเมื่อยังไม่มีผู้ใช้ในระบบ บังคับเปลี่ยนรหัสผ่านเมื่อ login ครั้งแรก)
ktt.bootstrap.admin-email=${KTT_ADMIN_EMAIL:admin@ktt.local}
ktt.bootstrap.admin-name=${KTT_ADMIN_NAME:ผู้ดูแลระบบ}
%dev.ktt.bootstrap.admin-password=Admin@12345
%test.ktt.bootstrap.admin-password=Admin@12345
%prod.ktt.bootstrap.admin-password=${KTT_ADMIN_PASSWORD:}

# URL หน้าเว็บ (ใช้สร้างลิงก์ในอีเมล)
ktt.app.base-url=http://localhost:4200
%prod.ktt.app.base-url=${KTT_APP_BASE_URL}
ktt.app.name=KTT Back Office

# ---------- Cache ----------
quarkus.cache.caffeine."session-active".expire-after-write=30S
quarkus.cache.caffeine."session-active".maximum-size=10000

# ---------- Mail ----------
quarkus.mailer.from=${MAIL_FROM:no-reply@ktt.local}
%dev.quarkus.mailer.mock=true
%test.quarkus.mailer.mock=true
%prod.quarkus.mailer.host=${SMTP_HOST:}
%prod.quarkus.mailer.port=${SMTP_PORT:587}
%prod.quarkus.mailer.username=${SMTP_USER:}
%prod.quarkus.mailer.password=${SMTP_PASSWORD:}
%prod.quarkus.mailer.start-tls=REQUIRED

# ---------- OpenAPI ----------
quarkus.smallrye-openapi.info-title=KTT Back Office API
quarkus.smallrye-openapi.security-scheme=jwt
quarkus.swagger-ui.always-include=false

quarkus.log.category."com.ktt".level=INFO
%dev.quarkus.log.category."com.ktt".level=DEBUG
