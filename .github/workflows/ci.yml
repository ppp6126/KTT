name: CI

on:
  push:
    branches: [main, dev, 'ci/**']
  pull_request:

jobs:
  backend:
    name: Backend (Java 21 / Quarkus)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ktt
          POSTGRES_PASSWORD: ktt
          POSTGRES_DB: ktt
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ktt" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      QUARKUS_DATASOURCE_DEVSERVICES_ENABLED: 'false'
      QUARKUS_DATASOURCE_USERNAME: ktt
      QUARKUS_DATASOURCE_PASSWORD: ktt
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile + unit tests
        run: mvn -B -ntp test
      - name: Create empty databases for each integration test
        run: |
          for db in ktt_auth ktt_smoke; do
            PGPASSWORD=ktt psql -h localhost -U ktt -d ktt -c "create database $db"
          done
      - name: Integration test - auth flow (PostgreSQL)
        env:
          QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://localhost:5432/ktt_auth
        run: mvn -B -ntp test -Dtest=AuthFlowIT -Dsurefire.failIfNoSpecifiedTests=false 2>&1 | tee it-auth.log; exit ${PIPESTATUS[0]}
      - name: Integration test - all phases API smoke + backup
        if: always()
        env:
          QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://localhost:5432/ktt_smoke
        run: mvn -B -ntp test -Dtest=ApiSmokeIT -Dsurefire.failIfNoSpecifiedTests=false 2>&1 | tee it-smoke.log; exit ${PIPESTATUS[0]}
      - name: Report failures as annotations
        if: failure()
        run: |
          for f in it-auth.log it-smoke.log; do
            [ -f "$f" ] || continue
            grep -nE 'ERROR|Caused by|Exception|expected|FAIL|Tests run|"code"|"message"|Request URI|Status code|HTTP/1.1' "$f" | grep -v "^.*DEBUG" | head -c 30000 > "$f.err" || true
            split -b 3500 "$f.err" "$f.part." || true
            for p in "$f".part.*; do
              [ -f "$p" ] || continue
              msg=$(sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' "$p")
              echo "::error title=$f::$msg"
            done
          done
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/
          if-no-files-found: ignore

  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx ng build
      - run: npx ng test --watch=false
