name: CI

on:
  push:
    branches: [main, dev, 'ci/**']
  pull_request:

jobs:
  backend:
    name: Backend (Java 21 / Quarkus)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile + unit tests
        run: mvn -B -ntp test
      - name: Integration test - auth flow (PostgreSQL via Dev Services)
        run: mvn -B -ntp test -Dtest=AuthFlowIT -Dsurefire.failIfNoSpecifiedTests=false 2>&1 | tee it-auth.log; exit ${PIPESTATUS[0]}
      - name: Integration test - all phases API smoke + backup
        if: always()
        run: mvn -B -ntp test -Dtest=ApiSmokeIT -Dsurefire.failIfNoSpecifiedTests=false 2>&1 | tee it-smoke.log; exit ${PIPESTATUS[0]}
      - name: Report failures as annotations
        if: failure()
        run: |
          for f in it-auth.log it-smoke.log; do
            [ -f "$f" ] || continue
            grep -nE "ERROR|Caused by|Exception|expected|FAIL|Tests run" "$f" | grep -v "^.*DEBUG" | head -c 30000 > "$f.err" || true
            split -b 3500 "$f.err" "$f.part." || true
            for p in "$f".part.*; do
              [ -f "$p" ] || continue
              msg=$(sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' "$p")
              echo "::error title=$f::$msg"
            done
          done
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/
          if-no-files-found: ignore

  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx ng build
      - run: npx ng test --watch=false
